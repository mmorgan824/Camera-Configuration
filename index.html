<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axis Camera Configuration Tool</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="Axis.css" />
</head>

<body>
<div class="app-container" id="app">
    <h1><i class="fas fa-video"></i> Axis Camera Configuration</h1>

    <!-- FORM START -->
    <form id="configForm" method="post" enctype="multipart/form-data">

        <!-- Credentials -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-key"></i> Credentials
            </div>

            <div class="row">
                <span class="row-label row-label-sm">Username</span>
                <input type="text" id="usernameInput" name="username" value="root" />

                <span class="row-label row-label-sm">Password</span>
                <input type="password" id="passwordInput" name="password" value="pass" />
            </div>

            <div class="hint">
                <i class="fas fa-info-circle"></i>
                These credentials will be automatically set on all cameras
            </div>
        </div>

        <!-- Excel Upload -->
        <div class="section">
            <div class="section-title">
                <i class="fas fa-file-excel"></i> Excel File
            </div>

            <div class="row">
                <span class="row-label">Excel File</span>

                <div class="file-browse-group">
                    <input type="text" id="excelFileInput" placeholder="path/to/file.xlsx" readonly />

                    <button type="button" class="btn btn-outline btn-sm" id="browseBtn">
                        <i class="fas fa-folder-open"></i> Browse
                    </button>

                    <input type="file" id="fileInput" name="excelFile" accept=".xlsx,.xls" style="display:none;" />
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="section" style="padding-bottom: 14px;">
            <div class="action-bar">
                <button type="submit" class="btn btn-success" id="startBtn">
                    <i class="fas fa-play"></i> Start Configuration
                </button>

                <button type="button" class="btn btn-danger" id="stopBtn" disabled>
                    <i class="fas fa-stop"></i> Stop
                </button>

                <button type="button" class="btn btn-outline" id="clearLogBtn">
                    <i class="fas fa-eraser"></i> Clear Log
                </button>

                <span class="status-badge" id="statusBadge">
                    <i class="fas fa-circle" style="color: #4a9e6b;"></i> Ready
                </span>

                <span class="progress-percent" id="progressText">0%</span>
            </div>

            <div class="progress-wrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width:0%;"></div>
                </div>
                <span class="progress-label" id="progressLabel">0%</span>
            </div>
        </div>

    </form>
    <!-- FORM END -->

    <!-- Log -->
    <div class="section" style="margin-bottom: 0; padding-bottom: 12px;">
        <div class="section-title" style="margin-bottom: 8px;">
            <i class="fas fa-terminal"></i> Log Output
        </div>

        <div class="log-area" id="logArea">
            <span class="log-line info">[--:--:--] INFO: Ready</span>
        </div>
    </div>
</div>

<script src="Axis.js"></script>
</body>
</html>
